spring:
  application:
    name: board

  datasource:
    url: jdbc:h2:mem:board;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 500

  h2:
    console:
      enabled: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
